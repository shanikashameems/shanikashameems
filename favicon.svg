<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d6ff" />
      <stop offset="50%" stop-color="#387bf6" />
      <stop offset="100%" stop-color="#002b80" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8edf5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle shadow -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" />
  
  <!-- Glowing Cyber Border -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="url(#borderGrad)" stroke-width="14" opacity="0.9" filter="url(#glow)" />
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Geometric Tech Monogram 'S' -->
  <path d="M336 172 C336 128 296 112 256 112 C200 112 168 140 168 184 C168 252 344 236 344 324 C344 372 304 400 256 400 C192 400 160 364 160 316"
        fill="none"
        stroke="url(#textGrad)"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Active Matrix Neural Glow Dot -->
  <circle cx="364" cy="148" r="16" fill="#00d6ff" filter="url(#glow)" />
  <circle cx="364" cy="148" r="10" fill="#ffffff" />
</svg>